<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Surebet - Best Bets</title>
    <style>
        :root {
            --bg-color: #0b1416;
            --card-bg: #112225;
            --accent-gold: #c5a035;
            --text-color: #ffffff;
            --text-muted: #8da4a7;
            --green-profit: #00ff88;
            --red-loss: #ff4d4d;
            --pink-lay: #ff6b81;
            --purple-ext: #a29bfe;
            --input-bg: #ffffff;
            --input-text: #112225;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 980px;
            background-color: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .top-controls {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.25);
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-gold);
            align-items: center;
            flex-wrap: wrap;
        }

        .top-controls label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 14px;
        }

        .top-controls select {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background-color: var(--input-bg);
            color: var(--input-text);
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .bet-column {
            background: rgba(0, 0, 0, 0.25);
            padding: 20px;
            border-radius: 8px;
            border-top: 4px solid var(--accent-gold);
            position: relative;
            transition: all 0.2s ease;
        }

        .bet-column.is-lay-mode {
            border-top-color: var(--pink-lay);
            background: rgba(255, 107, 129, 0.05);
        }

        .bet-column.is-ext-mode {
            border-top-color: var(--purple-ext);
            background: rgba(162, 155, 254, 0.05);
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(197, 160, 53, 0.2);
            gap: 5px;
        }

        .bet-title-input {
            color: var(--accent-gold);
            font-size: 15px;
            font-weight: bold;
            background: transparent;
            border: none;
            border-bottom: 1px dashed transparent;
            width: 110px;
            padding: 2px 0;
            transition: border-color 0.2s;
        }

        .bet-title-input:hover, .bet-title-input:focus {
            border-bottom-color: var(--accent-gold);
            outline: none;
        }

        .bet-column.is-lay-mode .bet-title-input {
            color: var(--pink-lay);
        }

        .bet-column.is-ext-mode .bet-title-input {
            color: var(--purple-ext);
        }

        .bet-options {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .bet-options label {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }

        .chk-fb-label {
            color: var(--green-profit) !important;
            font-weight: bold;
        }

        .chk-lay-label {
            color: var(--pink-lay) !important;
            font-weight: bold;
        }

        .chk-ext-label {
            color: var(--purple-ext) !important;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-group label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 13px;
        }

        .input-group input[type="number"] {
            width: 60%;
            padding: 7px 10px;
            border-radius: 6px;
            border: none;
            background-color: var(--input-bg);
            color: var(--input-text);
            font-size: 15px;
            font-weight: bold;
            text-align: right;
        }

        .input-group input:focus {
            outline: 2px solid var(--accent-gold);
        }

        .boost-group {
            background: rgba(197, 160, 53, 0.08);
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px dashed rgba(197, 160, 53, 0.4);
        }

        .boost-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }

        .boost-controls label {
            font-size: 12px;
            color: var(--accent-gold);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .boost-controls input[type="number"] {
            width: 45%;
            padding: 5px 8px;
            font-size: 13px;
        }

        .boost-info {
            font-size: 11px;
            color: var(--green-profit);
            text-align: right;
            margin-top: 4px;
            font-weight: bold;
            display: none;
        }

        .result-box {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 7px 10px;
            border-radius: 6px;
            width: 60%;
            text-align: right;
            font-weight: bold;
            font-size: 15px;
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .global-controls {
            background: rgba(197, 160, 53, 0.05);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid rgba(197, 160, 53, 0.2);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .global-controls .input-group {
            flex: 1;
            min-width: 200px;
            margin-bottom: 0;
        }

        .footer-results {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px solid rgba(197, 160, 53, 0.3);
            font-size: 18px;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 15px;
        }

        .res-val { color: var(--green-profit); }
        .res-loss { color: var(--red-loss); }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-controls">
            <div>
                <label for="numBets">Nº de Apostas:</label>
                <select id="numBets">
                    <option value="2">2 Apostas</option>
                    <option value="3" selected>3 Apostas</option>
                    <option value="4">4 Apostas</option>
                    <option value="5">5 Apostas</option>
                    <option value="6">6 Apostas</option>
                    <option value="7">7 Apostas</option>
                    <option value="8">8 Apostas</option>
                    <option value="9">9 Apostas</option>
                    <option value="10">10 Apostas</option>
                </select>
            </div>
        </div>

        <div class="grid-inputs" id="betsContainer">
            <!-- Colunas geradas via JS -->
        </div>

        <div class="global-controls">
            <div class="input-group">
                <label>Arredondar para:</label>
                <input type="number" id="roundTo" value="0.01" step="0.01" min="0.01">
            </div>
            <div class="input-group">
                <label>Retenção FB Futura (%):</label>
                <input type="number" id="extRate" value="70" step="1" min="0" max="100" title="Porcentagem estimada de conversão da Freebet a receber">
            </div>
            <div class="input-group">
                <label>Investimento Total (Seu Bolso):</label>
                <input type="number" id="totalInvestment" placeholder="0.00" step="0.01">
            </div>
        </div>

        <div class="footer-results">
            <div>RETORNO MÍNIMO: <span id="finalReturn" class="res-val">R$ 0.00</span></div>
            <div>LUCRO MÍNIMO R$: <span id="finalProfitVal" class="res-val">R$ 0.00</span></div>
            <div>EXTRAÇÃO/LUCRO %: <span id="finalProfitPercent" class="res-val">0.00%</span></div>
        </div>
    </div>

    <script>
        let numBetsSelect = document.getElementById('numBets');
        let betsContainer = document.getElementById('betsContainer');
        let roundToInput = document.getElementById('roundTo');
        let extRateInput = document.getElementById('extRate');
        let totalInvestmentInput = document.getElementById('totalInvestment');
        
        let finalReturnSpan = document.getElementById('finalReturn');
        let finalProfitValSpan = document.getElementById('finalProfitVal');
        let finalProfitPercentSpan = document.getElementById('finalProfitPercent');

        let betsData = [];
        let isRecalculating = false;
        let activeFixedIndex = -1;

        function buildBetColumns(count) {
            betsContainer.innerHTML = '';
            betsData = [];

            for (let i = 0; i < count; i++) {
                betsData.push({
                    name: `Aposta ${i + 1}`,
                    odd: 0,
                    comm: 0,
                    stake: 0,
                    distribute: true,
                    fixed: false,
                    isFreebet: false,
                    isLay: false,
                    isExtraction: false,
                    hasBoost: false,
                    boostPercent: 0
                });

                let col = document.createElement('div');
                col.className = 'bet-column';
                col.id = `col-${i}`;

                let boostHTML = '';
                if (i === 0) {
                    boostHTML = `
                        <div class="boost-group">
                            <div class="boost-controls">
                                <label title="Ativar Super Odds / Boost">
                                    <input type="checkbox" id="chkBoost"> Boost %
                                </label>
                                <input type="number" id="inpBoost" placeholder="Ex: 20" step="1" min="0" disabled>
                            </div>
                            <div class="boost-info" id="boostInfo">Odd Turbinada: 1.00</div>
                        </div>
                    `;
                }

                col.innerHTML = `
                    <div class="bet-header">
                        <input type="text" class="bet-title-input" id="title-${i}" value="Aposta ${i + 1}" data-index="${i}" title="Clique para renomear (Ex: Bet365, Betano)">
                        <div class="bet-options">
                            <label title="Qualificação de Freebet (Gerar Bônus)" class="chk-ext-label">
                                <input type="checkbox" class="chk-ext" data-index="${i}"> E
                            </label>
                            <label title="Aposta Contra (Lay - Exchange)" class="chk-lay-label">
                                <input type="checkbox" class="chk-lay" data-index="${i}"> L
                            </label>
                            <label title="Usar Freebet (Aposta Grátis)" class="chk-fb-label">
                                <input type="checkbox" class="chk-fb" data-index="${i}"> FB
                            </label>
                            <label title="Distribuir Lucro">
                                <input type="checkbox" class="chk-d" data-index="${i}" checked> D
                            </label>
                            <label title="Aposta Fixa (Corrigida)">
                                <input type="radio" name="fixedBet" class="rad-c" data-index="${i}"> C
                            </label>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Odd:</label>
                        <input type="number" class="inp-odd" data-index="${i}" placeholder="Ex: 2.00" step="0.001" min="0">
                    </div>
                    ${boostHTML}
                    <div class="input-group">
                        <label>Comissão (%):</label>
                        <input type="number" class="inp-comm" data-index="${i}" placeholder="0" step="0.1" min="0" value="0">
                    </div>
                    <div class="input-group">
                        <label id="lbl-stake-${i}">Apostar (R$):</label>
                        <input type="number" class="inp-stake" data-index="${i}" placeholder="0.00" step="0.01">
                    </div>
                    <div class="input-group" id="group-resp-${i}" style="display: none;">
                        <label>Responsab. (R$):</label>
                        <div class="result-box" id="resp-${i}" style="color: var(--pink-lay);">0.00</div>
                    </div>
                    <div class="input-group">
                        <label>Retorno Líq.:</label>
                        <div class="result-box res-return" id="return-${i}">0.00</div>
                    </div>
                    <div class="input-group">
                        <label>Lucro Líq.:</label>
                        <div class="result-box res-profit" id="profit-${i}">0.00</div>
                    </div>
                `;
                betsContainer.appendChild(col);
            }

            attachEvents();
            recalculate('total');
        }

        function attachEvents() {
            document.querySelectorAll('.bet-title-input').forEach(el => {
                el.addEventListener('input', (e) => {
                    let idx = e.target.dataset.index;
                    betsData[idx].name = e.target.value;
                });
            });

            document.querySelectorAll('.inp-odd').forEach(el => {
                el.addEventListener('input', (e) => {
                    let idx = e.target.dataset.index;
                    betsData[idx].odd = parseFloat(e.target.value) || 0;
                    recalculate('total');
                });
            });

            document.querySelectorAll('.inp-comm').forEach(el => {
                el.addEventListener('input', (e) => {
                    let idx = e.target.dataset.index;
                    betsData[idx].comm = parseFloat(e.target.value) || 0;
                    recalculate('total');
                });
            });

            document.querySelectorAll('.inp-stake').forEach(el => {
                el.addEventListener('input', (e) => {
                    let idx = e.target.dataset.index;
                    betsData[idx].stake = parseFloat(e.target.value) || 0;
                    recalculate(`stake-${idx}`);
                });
            });

            document.querySelectorAll('.chk-d').forEach(el => {
                el.addEventListener('change', (e) => {
                    let idx = e.target.dataset.index;
                    betsData[idx].distribute = e.target.checked;
                    recalculate('total');
                });
            });

            document.querySelectorAll('.chk-fb').forEach(el => {
                el.addEventListener('change', (e) => {
                    let idx = e.target.dataset.index;
                    betsData[idx].isFreebet = e.target.checked;
                    recalculate('total');
                });
            });

            document.querySelectorAll('.chk-ext').forEach(el => {
                el.addEventListener('change', (e) => {
                    let idx = e.target.dataset.index;
                    let isExt = e.target.checked;
                    betsData[idx].isExtraction = isExt;

                    let col = document.getElementById(`col-${idx}`);
                    if (isExt) {
                        col.classList.add('is-ext-mode');
                    } else {
                        col.classList.remove('is-ext-mode');
                    }
                    recalculate('total');
                });
            });

            document.querySelectorAll('.chk-lay').forEach(el => {
                el.addEventListener('change', (e) => {
                    let idx = e.target.dataset.index;
                    let isLay = e.target.checked;
                    betsData[idx].isLay = isLay;

                    let col = document.getElementById(`col-${idx}`);
                    let lblStake = document.getElementById(`lbl-stake-${idx}`);
                    let groupResp = document.getElementById(`group-resp-${idx}`);

                    if (isLay) {
                        col.classList.add('is-lay-mode');
                        lblStake.innerText = "Stake Lay (R$):";
                        groupResp.style.display = 'flex';
                    } else {
                        col.classList.remove('is-lay-mode');
                        lblStake.innerText = "Apostar (R$):";
                        groupResp.style.display = 'none';
                    }

                    recalculate('total');
                });
            });

            document.querySelectorAll('.rad-c').forEach(el => {
                el.addEventListener('click', (e) => {
                    let idx = parseInt(e.target.dataset.index);
                    if (activeFixedIndex === idx) {
                        e.target.checked = false;
                        activeFixedIndex = -1;
                    } else {
                        activeFixedIndex = idx;
                    }
                    recalculate('total');
                });
            });

            let chkBoost = document.getElementById('chkBoost');
            let inpBoost = document.getElementById('inpBoost');

            if (chkBoost && inpBoost) {
                chkBoost.addEventListener('change', (e) => {
                    let active = e.target.checked;
                    inpBoost.disabled = !active;
                    betsData[0].hasBoost = active;
                    if (!active) {
                        document.getElementById('boostInfo').style.display = 'none';
                    }
                    recalculate('total');
                });

                inpBoost.addEventListener('input', (e) => {
                    betsData[0].boostPercent = parseFloat(e.target.value) || 0;
                    recalculate('total');
                });
            }
        }

        function setElementStyle(element, value) {
            if (value < -0.01) {
                element.style.color = 'var(--red-loss)';
            } else if (value > 0.01) {
                element.style.color = 'var(--green-profit)';
            } else {
                element.style.color = 'var(--text-color)';
            }
        }

        function recalculate(trigger) {
            if (isRecalculating) return;
            isRecalculating = true;

            let count = betsData.length;
            let roundTo = parseFloat(roundToInput.value) || 0.01;
            if (roundTo <= 0) roundTo = 0.01;

            let extPercent = (parseFloat(extRateInput.value) || 70) / 100;

            let validOdds = true;
            let effectiveOdds = [];
            let freebetMultiplier = [];

            for (let i = 0; i < count; i++) {
                let o = betsData[i].odd;
                let c = betsData[i].comm;

                if (i === 0 && betsData[0].hasBoost && betsData[0].boostPercent > 0) {
                    let boostedOdd = 1 + (o - 1) * (1 + betsData[0].boostPercent / 100);
                    let boostInfo = document.getElementById('boostInfo');
                    if (boostInfo && o > 1) {
                        boostInfo.innerText = `Odd Turbinada: ${boostedOdd.toFixed(3)}`;
                        boostInfo.style.display = 'block';
                    }
                    o = boostedOdd;
                }

                if (o <= 1) validOdds = false;

                let effOdd = 0;
                if (betsData[i].isLay) {
                    effOdd = o - (c / 100);
                } else {
                    effOdd = 1 + (o - 1) * (1 - c / 100);
                }
                effectiveOdds.push(effOdd);
                
                let fbMult = betsData[i].isFreebet ? (effOdd - 1) : effOdd;
                freebetMultiplier.push(fbMult);
            }

            if (!validOdds) {
                for (let i = 0; i < count; i++) {
                    document.getElementById(`return-${i}`).innerText = "0.00";
                    document.getElementById(`profit-${i}`).innerText = "0.00";
                    if (document.getElementById(`resp-${i}`)) {
                        document.getElementById(`resp-${i}`).innerText = "0.00";
                    }
                }
                finalReturnSpan.innerText = "R$ 0.00";
                finalProfitValSpan.innerText = "R$ 0.00";
                finalProfitPercentSpan.innerText = "0.00%";
                isRecalculating = false;
                return;
            }

            let stakes = new Array(count).fill(0);
            let fbIndex = betsData.findIndex(b => b.isFreebet);
            let extIndex = betsData.findIndex(b => b.isExtraction);

            // CÁLCULO DE APOSTA QUALIFICATIVA (FLAG E) - IGUALA O LUCRO NAS COBERTURAS
            if (extIndex !== -1 && !trigger.startsWith('stake-') && activeFixedIndex === -1) {
                let extStake = parseFloat(document.querySelectorAll('.inp-stake')[extIndex].value) || 20;
                stakes[extIndex] = extStake;

                let sumInvCoverage = 0;
                for (let i = 0; i < count; i++) {
                    if (i !== extIndex) {
                        sumInvCoverage += 1 / freebetMultiplier[i];
                    }
                }

                let futureFbVal = extStake * extPercent;
                let targetCoverageReturn = (extStake - futureFbVal) / (1 - sumInvCoverage);

                for (let i = 0; i < count; i++) {
                    if (i !== extIndex) {
                        let rawS = targetCoverageReturn / freebetMultiplier[i];
                        stakes[i] = Math.round(rawS / roundTo) * roundTo;
                    }
                }
            }
            // CÁLCULO DE APOSTA COM FREEBET JA EXISTENTE (FLAG FB)
            else if (fbIndex !== -1 && activeFixedIndex === -1 && !trigger.startsWith('stake-')) {
                let fbStake = parseFloat(document.querySelectorAll('.inp-stake')[fbIndex].value) || 50;
                stakes[fbIndex] = fbStake;
                
                let targetReturn = fbStake * freebetMultiplier[fbIndex];

                for (let i = 0; i < count; i++) {
                    if (i !== fbIndex) {
                        let rawS = targetReturn / effectiveOdds[i];
                        stakes[i] = Math.round(rawS / roundTo) * roundTo;
                    }
                }
            } 
            // CÁLCULO DE APOSTA FIXA / MANUAL
            else if (activeFixedIndex !== -1 || trigger.startsWith('stake-')) {
                let fixIdx = activeFixedIndex !== -1 ? activeFixedIndex : parseInt(trigger.split('-')[1]);
                let baseStake = parseFloat(document.querySelectorAll('.inp-stake')[fixIdx].value) || 0;
                
                if (baseStake > 0) {
                    stakes[fixIdx] = baseStake;
                    let targetReturn = baseStake * freebetMultiplier[fixIdx];

                    for (let i = 0; i < count; i++) {
                        if (i !== fixIdx) {
                            let rawS = targetReturn / freebetMultiplier[i];
                            stakes[i] = Math.round(rawS / roundTo) * roundTo;
                        }
                    }
                }
            } 
            // CÁLCULO PADRÃO PELO INVESTIMENTO TOTAL
            else {
                let totalInvest = parseFloat(totalInvestmentInput.value) || 0;
                let invSum = 0;
                for (let i = 0; i < count; i++) {
                    if (betsData[i].isLay) {
                        invSum += (betsData[i].odd - 1) / effectiveOdds[i];
                    } else {
                        invSum += 1 / effectiveOdds[i];
                    }
                }

                if (totalInvest > 0) {
                    for (let i = 0; i < count; i++) {
                        let rawS = 0;
                        if (betsData[i].isLay) {
                            rawS = (totalInvest * ((betsData[i].odd - 1) / effectiveOdds[i])) / (invSum * (betsData[i].odd - 1));
                        } else {
                            rawS = (totalInvest * (1 / effectiveOdds[i])) / invSum;
                        }
                        stakes[i] = Math.round(rawS / roundTo) * roundTo;
                    }
                }
            }

            let ownPocketInvest = 0;
            for (let i = 0; i < count; i++) {
                if (!betsData[i].isFreebet) {
                    if (betsData[i].isLay) {
                        let liability = stakes[i] * (betsData[i].odd - 1);
                        ownPocketInvest += liability;
                    } else {
                        ownPocketInvest += stakes[i];
                    }
                }
            }

            if (document.activeElement !== totalInvestmentInput) {
                totalInvestmentInput.value = ownPocketInvest > 0 ? ownPocketInvest.toFixed(2) : "";
            }

            let returns = [];
            let profits = [];

            for (let i = 0; i < count; i++) {
                let inpStake = document.querySelectorAll('.inp-stake')[i];
                if (document.activeElement !== inpStake) {
                    inpStake.value = stakes[i] > 0 ? stakes[i].toFixed(2) : "";
                }

                let liability = 0;
                if (betsData[i].isLay) {
                    liability = stakes[i] * (betsData[i].odd - 1);
                    let respDiv = document.getElementById(`resp-${i}`);
                    if (respDiv) respDiv.innerText = liability.toFixed(2);
                }

                let ret = stakes[i] * freebetMultiplier[i];

                // Adiciona o valor estimado da Freebet resgatada se a casa do Bônus (Flag E) PERDER
                if (extIndex !== -1 && i !== extIndex) {
                    let fbRefundValue = stakes[extIndex] * extPercent;
                    ret += fbRefundValue;
                }

                let prof = ret - ownPocketInvest;

                returns.push(ret);
                profits.push(prof);

                let retDiv = document.getElementById(`return-${i}`);
                let profDiv = document.getElementById(`profit-${i}`);

                retDiv.innerText = ret.toFixed(2);
                profDiv.innerText = prof.toFixed(2);
                setElementStyle(profDiv, prof);
            }

            let worstCaseReturn = Math.min(...returns);
            let worstCaseProfit = Math.min(...profits);

            let totalFbStake = 0;
            for(let i=0; i<count; i++) if(betsData[i].isFreebet) totalFbStake += stakes[i];

            let profitPercent = 0;
            if (totalFbStake > 0) {
                profitPercent = (worstCaseProfit / totalFbStake) * 100;
            } else if (ownPocketInvest > 0) {
                profitPercent = (worstCaseProfit / ownPocketInvest) * 100;
            }

            finalReturnSpan.innerText = "R$ " + worstCaseReturn.toFixed(2);
            finalProfitValSpan.innerText = "R$ " + worstCaseProfit.toFixed(2);
            finalProfitPercentSpan.innerText = profitPercent.toFixed(2) + "%";

            let styleClass = worstCaseProfit < -0.01 ? "res-loss" : "res-val";
            finalReturnSpan.className = styleClass;
            finalProfitValSpan.className = styleClass;
            finalProfitPercentSpan.className = styleClass;

            isRecalculating = false;
        }

        numBetsSelect.addEventListener('change', (e) => {
            buildBetColumns(parseInt(e.target.value));
        });

        roundToInput.addEventListener('input', () => recalculate('total'));
        extRateInput.addEventListener('input', () => recalculate('total'));
        totalInvestmentInput.addEventListener('input', () => recalculate('total'));

        buildBetColumns(3);
    </script>
</body>
</html>
