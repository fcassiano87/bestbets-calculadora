<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Surebet - Best Bets</title>
    <style>
        :root {
            --bg-color: #0b1416;
            --card-bg: #112225;
            --accent-gold: #c5a035;
            --text-color: #ffffff;
            --text-muted: #8da4a7;
            --green-profit: #00ff88;
            --red-loss: #ff4d4d;
            --input-bg: #ffffff;
            --input-text: #112225;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background-color: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header img {
            max-width: 220px;
            height: auto;
        }

        .top-controls {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.25);
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-gold);
            align-items: center;
            flex-wrap: wrap;
        }

        .top-controls label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 14px;
        }

        .top-controls select {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background-color: var(--input-bg);
            color: var(--input-text);
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .bet-column {
            background: rgba(0, 0, 0, 0.25);
            padding: 20px;
            border-radius: 8px;
            border-top: 4px solid var(--accent-gold);
            position: relative;
        }

        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(197, 160, 53, 0.2);
        }

        .bet-title {
            color: var(--accent-gold);
            font-size: 16px;
            font-weight: bold;
        }

        .bet-options {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .bet-options label {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-group label {
            font-weight: 600;
            color: var(--text-muted);
            font-size: 13px;
        }

        .input-group input[type="number"] {
            width: 60%;
            padding: 7px 10px;
            border-radius: 6px;
            border: none;
            background-color: var(--input-bg);
            color: var(--input-text);
            font-size: 15px;
            font-weight: bold;
            text-align: right;
        }

        .input-group input:focus {
            outline: 2px solid var(--accent-gold);
        }

        .result-box {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 7px 10px;
            border-radius: 6px;
            width: 60%;
            text-align: right;
            font-weight: bold;
            font-size: 15px;
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .global-controls {
            background: rgba(197, 160, 53, 0.05);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid rgba(197, 160, 53, 0.2);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .global-controls .input-group {
            flex: 1;
            min-width: 200px;
            margin-bottom: 0;
        }

        .footer-results {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px solid rgba(197, 160, 53, 0.3);
            font-size: 20px;
            font-weight: bold;
        }

        .res-val { color: var(--green-profit); }
        .res-loss { color: var(--red-loss); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="https://i.postimg.cc/pTRm7MvP/Logo.png" alt="Best Bets Logo">
        </div>

        <div class="top-controls">
            <div>
                <label for="numBets">Nº de Apostas:</label>
                <select id="numBets">
                    <option value="2">2 Apostas</option>
                    <option value="3">3 Apostas</option>
                    <option value="4">4 Apostas</option>
                    <option value="5">5 Apostas</option>
                    <option value="6">6 Apostas</option>
                    <option value="7">7 Apostas</option>
                    <option value="8">8 Apostas</option>
                    <option value="9">9 Apostas</option>
                    <option value="10">10 Apostas</option>
                </select>
            </div>
        </div>

        <div class="grid-inputs" id="betsContainer">
            <!-- As colunas de apostas serão geradas via JS -->
        </div>

        <div class="global-controls">
            <div class="input-group">
                <label>Arredondar para:</label>
                <input type="number" id="roundTo" value="1" step="0.01" min="0.01">
            </div>
            <div class="input-group">
                <label>Investimento Total:</label>
                <input type="number" id="totalInvestment" placeholder="0.00" step="0.01">
            </div>
        </div>

        <div class="footer-results">
            <div>RETORNO MÍNIMO: <span id="finalReturn" class="res-val">R$ 0.00</span></div>
            <div>LUCRO: <span id="finalProfitPercent" class="res-val">0.00%</span></div>
        </div>
    </div>

    <script>
        let numBetsSelect = document.getElementById('numBets');
        let betsContainer = document.getElementById('betsContainer');
        let roundToInput = document.getElementById('roundTo');
        let totalInvestmentInput = document.getElementById('totalInvestment');
        let finalReturnSpan = document.getElementById('finalReturn');
        let finalProfitPercentSpan = document.getElementById('finalProfitPercent');

        let betsData = [];
        let isRecalculating = false;
        let activeFixedIndex = -1; // Sem aposta fixa inicialmente

        function buildBetColumns(count) {
            betsContainer.innerHTML = '';
            betsData = [];

            for (let i = 0; i < count; i++) {
                betsData.push({
                    odd: 0,
                    comm: 0,
                    stake: 0,
                    distribute: true,
                    fixed: false
                });

                let col = document.createElement('div');
                col.className = 'bet-column';
                col.innerHTML = `
                    <div class="bet-header">
                        <span class="bet-title">Aposta ${i + 1}</span>
                        <div class="bet-options">
                            <label title="Distribuir Lucro">
                                <input type="checkbox" class="chk-d" data-index="${i}" checked> D
                            </label>
                            <label title="Aposta Fixa (Corrigida)">
                                <input type="radio" name="fixedBet" class="rad-c" data-index="${i}"> C
                            </label>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Odd:</label>
                        <input type="number" class="inp-odd" data-index="${i}" placeholder="Ex: 2.00" step="0.001" min="0">
                    </div>
                    <div class="input-group">
                        <label>Comissão (%):</label>
                        <input type="number" class="inp-comm" data-index="${i}" placeholder="0" step="0.1" min="0" value="0">
                    </div>
                    <div class="input-group">
                        <label>Apostar (R$):</label>
                        <input type="number" class="inp-stake" data-index="${i}" placeholder="0.00" step="0.01">
                    </div>
                    <div class="input-group">
                        <label>Retorno Líq.:</label>
                        <div class="result-box res-return" id="return-${i}">0.00</div>
                    </div>
                    <div class="input-group">
                        <label>Lucro Líq.:</label>
                        <div class="result-box res-profit" id="profit-${i}">0.00</div>
                    </div>
                `;
                betsContainer.appendChild(col);
            }

            attachEvents();
            recalculate('total');
        }

        function attachEvents() {
            document.querySelectorAll('.inp-odd').forEach(el => {
                el.addEventListener('input', (e) => {
                    let idx = e.target.dataset.index;
                    betsData[idx].odd = parseFloat(e.target.value) || 0;
                    recalculate('total');
                });
            });

            document.querySelectorAll('.inp-comm').forEach(el => {
                el.addEventListener('input', (e) => {
                    let idx = e.target.dataset.index;
                    betsData[idx].comm = parseFloat(e.target.value) || 0;
                    recalculate('total');
                });
            });

            document.querySelectorAll('.inp-stake').forEach(el => {
                el.addEventListener('input', (e) => {
                    let idx = e.target.dataset.index;
                    betsData[idx].stake = parseFloat(e.target.value) || 0;
                    recalculate(`stake-${idx}`);
                });
            });

            document.querySelectorAll('.chk-d').forEach(el => {
                el.addEventListener('change', (e) => {
                    let idx = e.target.dataset.index;
                    betsData[idx].distribute = e.target.checked;
                    recalculate('total');
                });
            });

            document.querySelectorAll('.rad-c').forEach(el => {
                el.addEventListener('click', (e) => {
                    let idx = parseInt(e.target.dataset.index);
                    if (activeFixedIndex === idx) {
                        e.target.checked = false;
                        activeFixedIndex = -1;
                    } else {
                        activeFixedIndex = idx;
                    }
                    recalculate('total');
                });
            });
        }

        function setElementStyle(element, value) {
            if (value < 0) {
                element.style.color = 'var(--red-loss)';
            } else if (value > 0) {
                element.style.color = 'var(--green-profit)';
            } else {
                element.style.color = 'var(--text-color)';
            }
        }

        function recalculate(trigger) {
            if (isRecalculating) return;
            isRecalculating = true;

            let count = betsData.length;
            let roundTo = parseFloat(roundToInput.value) || 0.01;
            if (roundTo <= 0) roundTo = 0.01;

            let validOdds = true;
            let effectiveOdds = [];

            for (let i = 0; i < count; i++) {
                let o = betsData[i].odd;
                let c = betsData[i].comm;
                if (o <= 1) validOdds = false;

                // Odd líquida ajustada por comissão (ex: Betfair)
                let effOdd = 1 + (o - 1) * (1 - c / 100);
                effectiveOdds.push(effOdd);
            }

            if (!validOdds) {
                for (let i = 0; i < count; i++) {
                    document.getElementById(`return-${i}`).innerText = "0.00";
                    document.getElementById(`profit-${i}`).innerText = "0.00";
                }
                finalReturnSpan.innerText = "R$ 0.00";
                finalProfitPercentSpan.innerText = "0.00%";
                isRecalculating = false;
                return;
            }

            let stakes = new Array(count).fill(0);
            let totalInvest = parseFloat(totalInvestmentInput.value) || 0;

            // Lógica de distribuição proporcional de stakes (Surebet)
            let invSum = 0;
            for (let i = 0; i < count; i++) {
                invSum += 1 / effectiveOdds[i];
            }

            if (trigger === 'total' && activeFixedIndex === -1) {
                if (totalInvest > 0) {
                    for (let i = 0; i < count; i++) {
                        let rawS = (totalInvest * (1 / effectiveOdds[i])) / invSum;
                        stakes[i] = Math.round(rawS / roundTo) * roundTo;
                    }
                }
            } else if (activeFixedIndex !== -1 || trigger.startsWith('stake-')) {
                let fixIdx = activeFixedIndex !== -1 ? activeFixedIndex : parseInt(trigger.split('-')[1]);
                let baseStake = parseFloat(document.querySelectorAll('.inp-stake')[fixIdx].value) || 0;
                
                if (baseStake > 0) {
                    let targetReturn = baseStake * effectiveOdds[fixIdx];
                    for (let i = 0; i < count; i++) {
                        if (i === fixIdx) {
                            stakes[i] = baseStake;
                        } else {
                            let rawS = targetReturn / effectiveOdds[i];
                            stakes[i] = Math.round(rawS / roundTo) * roundTo;
                        }
                    }
                }
            }

            // Atualizar valores de stakes nas entradas
            let actualTotalInvest = stakes.reduce((a, b) => a + b, 0);
            totalInvestmentInput.value = actualTotalInvest > 0 ? actualTotalInvest.toFixed(2) : "";

            let returns = [];
            let profits = [];

            for (let i = 0; i < count; i++) {
                let inpStake = document.querySelectorAll('.inp-stake')[i];
                if (document.activeElement !== inpStake) {
                    inpStake.value = stakes[i] > 0 ? stakes[i].toFixed(2) : "";
                }

                let ret = stakes[i] * effectiveOdds[i];
                let prof = ret - actualTotalInvest;

                returns.push(ret);
                profits.push(prof);

                let retDiv = document.getElementById(`return-${i}`);
                let profDiv = document.getElementById(`profit-${i}`);

                retDiv.innerText = ret.toFixed(2);
                profDiv.innerText = prof.toFixed(2);
                setElementStyle(profDiv, prof);
            }

            let worstCaseReturn = Math.min(...returns);
            let profitPercent = actualTotalInvest > 0 ? (((1 / invSum) - 1) * 100) : 0;

            finalReturnSpan.innerText = "R$ " + worstCaseReturn.toFixed(2);
            finalProfitPercentSpan.innerText = profitPercent.toFixed(2) + "%";

            if (profitPercent < 0) {
                finalReturnSpan.className = "res-loss";
                finalProfitPercentSpan.className = "res-loss";
            } else {
                finalReturnSpan.className = "res-val";
                finalProfitPercentSpan.className = "res-val";
            }

            isRecalculating = false;
        }

        numBetsSelect.addEventListener('change', (e) => {
            buildBetColumns(parseInt(e.target.value));
        });

        roundToInput.addEventListener('input', () => recalculate('total'));
        totalInvestmentInput.addEventListener('input', () => recalculate('total'));

        // Inicializar com 2 apostas
        buildBetColumns(2);
    </script>
</body>
</html>
